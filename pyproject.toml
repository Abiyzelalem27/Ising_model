

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ising-model"
version = "0.1.0"
description = "Python tools for studying Ising models and Dicke states"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["src"]